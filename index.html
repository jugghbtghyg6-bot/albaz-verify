<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الأحياء - الأستاذ عبد الرحمن الباز</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #051f20; color: #fff; }
        main { width: min(92vw, 520px); text-align: center; padding: 32px; border-radius: 24px; background: #102f30; }
        h1 { margin: 0 0 8px; font-size: 22px; color: #f5bd4f; }
        p { color: #b7c8c0; line-height: 1.7; }
        .company { color: #f5bd4f; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; }
        .developer { margin: 0 0 12px; font-size: 12px; color: #8fb5b5; }
        .btn { display: block; margin-top: 18px; padding: 14px 22px; border-radius: 12px; background: #f5bd4f; color: #000; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <p class="company">الفضائي تكنولوجي</p>
        <h1>الأستاذ عبد الرحمن الباز</h1>
        <p class="developer">تم التصميم والتطوير بواسطة شركة الفضائي تكنولوجي</p>
        <p id="status">جاري توجيهك إلى الفيديو داخل التطبيق...</p>
        <a id="open" class="btn" href="#">فتح الفيديو داخل التطبيق</a>
    </main>
    <script>
        (function () {
            var parts = location.pathname.split('/').filter(Boolean);
            var videoId = parts[0] === 'video' ? decodeURIComponent(parts[1] || '') : '';
            var status = document.getElementById('status');
            var openBtn = document.getElementById('open');

            if (videoId) {
                var appUrl = 'albaz://video/' + encodeURIComponent(videoId);
                status.innerHTML = 'الفيديو رقم: <code>' + videoId + '</code>';
                openBtn.href = appUrl;
                try {
                    window.location.replace(appUrl);
                } catch (e) {}
            } else {
                status.textContent = 'الرابط غير مكتمل';
                openBtn.style.display = 'none';
            }
        })();
    </script>
</body>
</html>
