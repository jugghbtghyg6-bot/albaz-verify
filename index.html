<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الأحياء - الأستاذ عبد الرحمن الباز</title>
    <style>
        :root { color-scheme: dark; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            margin: 0; 
            min-height: 100vh; 
            display: grid; 
            place-items: center; 
            background: #0d0618; /* خلفية بنفسجية داكنة تحاكي التطبيق */
            color: #fff; 
        }
        main { 
            width: min(90vw, 420px); 
            text-align: center; 
            padding: 40px 24px; 
            border-radius: 32px; 
            background: #140d24; /* بطاقة بنفسجية أفتح قليلاً وراقية */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.25); /* إطار بنفسجي خفيف أنيق */
            position: relative;
            overflow: hidden;
        }
        /* تأثير إضاءة خلفية خفيفة */
        main::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: rgba(168, 85, 247, 0.15);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
        }
        .content-wrapper {
            position: relative;
            z-index: 1;
        }
        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #a855f7, #f5bd4f); /* إطار متدرج بين البنفسجي والذهبي */
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #1a103c;
        }
        .company { 
            color: #f5bd4f; 
            font-size: 11px; 
            font-weight: 700; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 { 
            margin: 0 0 6px; 
            font-size: 24px; 
            color: #ffffff; 
            font-weight: 800;
        }
        .developer { 
            margin: 0 0 24px; 
            font-size: 12px; 
            color: #c084fc; /* لون بنفسجي فاتح هادئ لحقوق التطوير */
        }
        #status {
            background: rgba(168, 85, 247, 0.08);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 22px;
            font-size: 14px;
            color: #e9d5ff;
            border: 1px solid rgba(168, 85, 247, 0.15);
        }
        .btn { 
            display: block; 
            width: 100%;
            box-sizing: border-box;
            padding: 15px 20px; 
            border-radius: 16px; 
            background: linear-gradient(135deg, #a855f7, #9333ea); /* زر بنفسجي احترافي يتماشى مع التطبيق */
            color: #ffffff; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 16px; 
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.4);
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.98); }
        code { color: #f5bd4f; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <div class="content-wrapper">
            <!-- صورة الأستاذ عبد الرحمن الباز -->
            <div class="avatar-container">
                <img src="https://yt3.googleusercontent.com/ytc/AIdro_kX2-jG8vVp03e4L6qW_s5_tZ7N8mPq1K9x_w=s160-c-k-c0x00ffffff-no-rj" alt="الأستاذ عبد الرحمن الباز" />
            </div>
            
            <p class="company">الفضائي تكنولوجي</p>
            <h1>الأستاذ عبد الرحمن الباز</h1>
            <p class="developer">تم التطوير بواسطة محمد طلعت — الفضائي تكنولوجي</p>
            
            <div id="status">جاري توجيهك إلى الفيديو داخل التطبيق...</div>
            
            <a id="open" class="btn" href="#">فتح الفيديو داخل التطبيق</a>
        </div>
    </main>

    <script>
        (function () {
            var parts = location.pathname.split('/').filter(Boolean);
            var videoId = parts[0] === 'video' ? decodeURIComponent(parts[1] || '') : '';
            var status = document.getElementById('status');
            var openBtn = document.getElementById('open');

            if (videoId) {
                var appUrl = 'albaz://video/' + encodeURIComponent(videoId);
                status.innerHTML = 'رقم الفيديو المطلوب: <code>' + videoId + '</code>';
                openBtn.href = appUrl;
                try {
                    window.location.replace(appUrl);
                } catch (e) {}
            } else {
                status.textContent = 'منصة الأحياء - جاهز للتشغيل';
                openBtn.textContent = 'فتح التطبيق الرئيسي';
                openBtn.href = 'albaz://home';
            }
        })();
    </script>
</body>
</html>
